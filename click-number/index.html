<!DOCTYPE html>
<html>

<head>
    <title>Click Number</title>
    <meta charset="UTF-8" />
    <link rel="stylesheet" href="css/styles.css">
</head>

<body>
    <div id="main"></div>
    <div id="startScreen">
        <button id="startBtn">START</button>
    </div>
    <div id="countdown"></div>
    <div id="clearScreen">
        <div id="clearContent">
            <h1>CLEAR!</h1>
            <p id="clearTime"></p>
            <p id="clearMistakes"></p>
            <p id="clearScore"></p>
            <p id="clearHighScore"></p>
            <button id="retryBtn">RETRY</button>
            <button id="resetHighScoreBtn">RESET HIGH SCORE</button>
        </div>
    </div>

    <script src="js/scripts.js"></script>
</body>

</html>
